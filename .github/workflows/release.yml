# Publishes to npm on a version tag via trusted publishing (OIDC): no token, provenance attached.
# One-time setup on npmjs.com: package settings -> Trusted publisher -> GitHub Actions,
# owner clawnify, repository agent-squash, workflow release.yml.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
